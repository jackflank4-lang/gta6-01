<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Neon Heat</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14101c; font-family: Arial, Helvetica, sans-serif; }
  #game-canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  .hud-topleft { position: absolute; top: 14px; left: 16px; }
  .hud-cash { font-size: 30px; font-weight: bold; color: #7dff9a; text-shadow: 2px 2px 0 #000; }
  .hud-hpwrap { width: 200px; height: 12px; background: #222; border: 1px solid #555; margin-top: 6px; }
  .hud-hp { height: 100%; width: 100%; background: #35d07a; }
  .hud-stars { font-size: 22px; letter-spacing: 2px; margin-top: 6px; text-shadow: 1px 1px 0 #000; }
  .hud-objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: 60vw; text-align: center; font-size: 17px; color: #fff; background: rgba(10, 8, 20, 0.65); padding: 8px 16px; border-radius: 6px; border: 1px solid rgba(255, 210, 74, 0.5); }
  .hud-speed { position: absolute; bottom: 18px; right: 22px; font-size: 30px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #000; }
  .hud-radio { position: absolute; bottom: 18px; left: 22px; font-size: 15px; color: #ffd24a; text-shadow: 1px 1px 0 #000; }
  .hud-map { position: absolute; bottom: 54px; right: 18px; width: 180px; height: 180px; border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 50%; background: #12101c; }
  .hud-toasts { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); text-align: center; }
  .hud-toast { background: rgba(10, 8, 20, 0.8); color: #ffd24a; padding: 8px 18px; border-radius: 6px; margin-top: 6px; font-size: 16px; border: 1px solid rgba(255, 210, 74, 0.4); transition: opacity 0.6s; }
  .hud-toast.fade { opacity: 0; }
  .menu { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(12, 8, 24, 0.82); color: #fff; z-index: 10; text-align: center; padding: 20px; }
  .menu-title { font-size: 64px; margin: 0; letter-spacing: 6px; color: #ff4fd8; text-shadow: 0 0 24px #ff4fd8, 3px 3px 0 #000; }
  .menu-sub { font-size: 22px; letter-spacing: 10px; color: #35e0ff; margin: 6px 0 18px; }
  .menu-desc { max-width: 560px; font-size: 17px; line-height: 1.5; color: #ddd; }
  .menu-btn { pointer-events: auto; display: block; margin: 10px auto 0; padding: 12px 42px; font-size: 18px; font-weight: bold; letter-spacing: 2px; color: #111; background: #ffd24a; border: none; border-radius: 6px; cursor: pointer; }
  .menu-btn:hover { background: #ffe27a; }
  .menu-howto { max-width: 560px; margin-top: 14px; font-size: 15px; line-height: 1.7; color: #bfefff; background: rgba(255, 255, 255, 0.08); padding: 12px 18px; border-radius: 6px; }
  .menu-foot { margin-top: 26px; font-size: 13px; color: #888; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
