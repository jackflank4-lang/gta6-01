<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Neon Heat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1420; font-family: 'Segoe UI', system-ui, sans-serif; color: #f2ead8; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { background: rgba(16, 12, 24, 0.72); border: 1px solid rgba(255, 210, 122, 0.35); border-radius: 8px; padding: 8px 12px; }
  #topleft { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; }
  #cash { font-size: 22px; font-weight: 700; color: #7dff8a; }
  #health-bar { width: 170px; height: 12px; background: #331111; border-radius: 6px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5a4a, #ff9a4a); }
  #health-text { font-size: 11px; color: #ffb0a0; }
  #topright { position: absolute; top: 12px; right: 12px; text-align: right; }
  #stars { font-size: 22px; letter-spacing: 2px; color: #ffd24a; }
  #stars.hot { text-shadow: 0 0 12px #ff2222; }
  #clock { font-size: 16px; color: #ffd27a; }
  #objective { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 15px; max-width: 46%; text-align: center; }
  #speed { position: absolute; bottom: 16px; right: 16px; font-size: 26px; font-weight: 700; color: #fff; text-shadow: 0 2px 8px #000; }
  #toast { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); font-size: 16px; background: rgba(16, 12, 24, 0.85); border: 1px solid #ffd27a; border-radius: 8px; padding: 8px 16px; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #minimap { position: absolute; bottom: 16px; left: 16px; width: 160px; height: 160px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); background: #10131a; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(26, 14, 42, 0.82), rgba(10, 6, 18, 0.88)); pointer-events: auto; }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 52px; margin: 0; letter-spacing: 3px; color: #ffd24a; text-shadow: 0 0 24px #ff2fb3, 0 4px 0 #000; }
  .overlay h2 { font-size: 18px; font-weight: 400; color: #c9b8e8; margin: 8px 0 28px; }
  .overlay button { pointer-events: auto; font-size: 18px; padding: 12px 34px; margin: 6px; border-radius: 8px; border: 1px solid #ffd24a; background: #2a1a3a; color: #ffd24a; cursor: pointer; }
  .overlay button:hover { background: #ffd24a; color: #1a1420; }
  #save-note { font-size: 13px; color: #9aa5b5; margin-top: 10px; }
  .keys { font-size: 13px; color: #9aa5b5; margin-top: 22px; line-height: 1.7; text-align: center; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay — Neon Heat: an open-world crime game"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud">
  <div id="topleft">
    <div class="panel"><span id="cash">$200</span><div id="health-bar"><div id="health-fill"></div></div><span id="health-text">100</span></div>
  </div>
  <div id="topright" class="panel"><div id="stars">☆☆☆☆☆</div><div id="clock">19:00</div></div>
  <div id="objective" class="panel">Press Start — Lena Cruz is waiting at the hideout</div>
  <canvas id="minimap" width="160" height="160"></canvas>
  <div id="speed"></div>
  <div id="toast"></div>
</div>
<div id="menu" class="overlay">
  <h1 id="menu-title">SOLMAR BAY</h1>
  <h2>Neon Heat — Lena Cruz vs Vic Marino</h2>
  <button id="btn-start">Start</button>
  <button id="btn-continue">Continue</button>
  <div id="save-note"></div>
  <div class="keys">WASD drive &amp; walk · E steal / exit car · F punch · Space jump<br>H horn · L headlights · N radio · C camera · P pause · Shift sprint</div>
</div>
<div id="pause-menu" class="overlay hidden">
  <h1>PAUSED</h1>
  <h2>Progress autosaved</h2>
  <button id="btn-resume">Resume</button>
  <button id="btn-quit">Quit to menu</button>
</div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
